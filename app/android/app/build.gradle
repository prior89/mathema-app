apply plugin: 'com.android.application'

def readDotEnvValue(String key) {
    def envFiles = [
        rootProject.file('../../.env'),
        rootProject.file('../../app/.env'),
        rootProject.file('../../app/.env.local'),
        rootProject.file('../../app/.env.production'),
        rootProject.file('../../app/.env.production.local'),
    ]
    for (def envFile : envFiles) {
        if (!envFile.exists()) continue
        for (def rawLine : envFile.readLines('UTF-8')) {
            def line = rawLine.trim()
            if (!line || line.startsWith('#')) continue
            def idx = line.indexOf('=')
            if (idx <= 0) continue
            if (line.substring(0, idx).trim() != key) continue
            def value = line.substring(idx + 1).trim()
            if ((value.startsWith('"') && value.endsWith('"')) ||
                (value.startsWith("'") && value.endsWith("'"))) {
                value = value.substring(1, value.length() - 1)
            }
            return value
        }
    }
    return ''
}

def envOrDotEnv(String key) {
    def value = System.getenv(key)
    if (value != null && value.trim()) return value.trim()
    return readDotEnvValue(key).trim()
}

def buildConfigString(String value) {
    return '"' + value.replace('\\', '\\\\').replace('"', '\\"') + '"'
}

def googleWebClientId = envOrDotEnv('VITE_GOOGLE_CLIENT_ID')
if (googleWebClientId == 'dummy-web-client.apps.googleusercontent.com') {
    googleWebClientId = ''
}

android {
    namespace = "ai.matheo.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "ai.matheo.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionCode: CI passes ANDROID_VERSION_CODE (= GITHUB_RUN_NUMBER) so
        // every signed AAB has a unique, monotonically-increasing code. Local
        // builds fall back to 1. Play Console refuses duplicate codes — this
        // is the cheapest way to stay safe without bumping the file every push.
        versionCode = (System.getenv("ANDROID_VERSION_CODE") ?: "1").toInteger()
        versionName "1.0"
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", buildConfigString(googleWebClientId)
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    // Release signing — credentials read from environment so the keystore
    // passphrase never lives in the tree. Set MATHEO_KEYSTORE_PASSWORD,
    // MATHEO_KEY_PASSWORD (often the same), MATHEO_KEY_ALIAS, and optionally
    // MATHEO_KEYSTORE_PATH before invoking `./gradlew bundleRelease`. The
    // local dev workflow loads these from app/../.keystore.env (gitignored).
    signingConfigs {
        release {
            def storePath = System.getenv('MATHEO_KEYSTORE_PATH') ?: 'matheo-release.jks'
            storeFile file(storePath)
            storePassword System.getenv('MATHEO_KEYSTORE_PASSWORD') ?: ''
            keyAlias System.getenv('MATHEO_KEY_ALIAS') ?: 'matheo'
            keyPassword System.getenv('MATHEO_KEY_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            // R8 minify + resource shrink trim the AAB ~30% on a Capacitor 8
            // shell. Keep rules for Capacitor / Sentry / firebase-admin live
            // in proguard-rules.pro alongside this gradle file.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            // Only sign release with the matheo key when the env vars are
            // present — local debug builds (e.g. ./gradlew assembleDebug) and
            // CI smoke jobs without secrets can still complete.
            if (System.getenv('MATHEO_KEYSTORE_PASSWORD')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation "com.android.billingclient:billing:8.0.0"
    implementation "com.google.android.play:app-update:2.1.0"
    implementation "androidx.credentials:credentials:1.6.0"
    implementation "androidx.credentials:credentials-play-services-auth:1.6.0"
    implementation "com.google.android.libraries.identity.googleid:googleid:1.2.0"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

// FCM (Phase D): apply google-services only when google-services.json exists.
// Download from Firebase Console → Project settings → Android app (ai.matheo.app).
def googleServicesJson = file('google-services.json')
if (googleServicesJson.exists()) {
    apply plugin: 'com.google.gms.google-services'
}
