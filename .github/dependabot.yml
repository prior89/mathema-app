version: 2
updates:
  # npm — repo root (monorepo workspaces manifest)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm — app workspace (React / Vite / Capacitor client)
  - package-ecosystem: "npm"
    directory: "/app"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "app"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # npm — server workspace (NestJS API)
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "npm"
      - "server"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"

  # Docker — server image
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "server"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Docker — math-helper image (partner-maintained directory; updates are
  # base-image only and should be reviewed with @Karvy-Singh before merging)
  - package-ecosystem: "docker"
    directory: "/services/math-helper"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"
      - "math-helper"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "Karvy-Singh"
