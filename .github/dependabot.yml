version: 2

# Dependabot config — Matheo monorepo.
#
# Lessons from the first run (30+ PRs in a single day, ~7 lock-sync fails):
# - npm workspaces share package-lock.json at root, so per-workspace
#   dependabot directories cause `npm ci` lock-sync errors. Use root only.
# - Daily cadence + no grouping = unmanageable PR noise on first sync.
# - Semver-major bumps need manual coordination (Prisma 7, NestJS 11,
#   React 19, react-router 7, etc.) — ignore them here and handle by hand.

updates:
  # npm — root scope updates root + both workspaces in a single coherent
  # PR set that keeps package-lock.json in sync.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 8
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "prior89"
    groups:
      prod:
        dependency-type: "production"
        update-types:
          - "patch"
          - "minor"
      dev:
        dependency-type: "development"
        update-types:
          - "patch"
          - "minor"
      types:
        patterns:
          - "@types/*"
    ignore:
      # All semver-major upgrades are deferred — track them in dedicated
      # PRs with migration notes (Prisma 5→7, NestJS 10→11, React 18→19,
      # react-router 6→7, Express 4→5, etc.).
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # GitHub Actions — patch + minor, grouped.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  # Server Dockerfile base image — minor + patch only.
  - package-ecosystem: "docker"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "server"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"

  # Math-helper Dockerfile
  - package-ecosystem: "docker"
    directory: "/services/math-helper"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 2
    labels:
      - "dependencies"
      - "docker"
      - "math-helper"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    reviewers:
      - "prior89"
    ignore:
      - dependency-name: "python"
        update-types:
          - "version-update:semver-major"
