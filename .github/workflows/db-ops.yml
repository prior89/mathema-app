name: DB ops — prod backfill & pool gate

# Run one-off data scripts against production PostgreSQL.
# Local PCs are blocked by the PG firewall (AllowAzureServices only); this
# workflow temporarily opens the GitHub runner IP, reads DATABASE_URL from
# Key Vault, runs the selected script(s), then removes the rule.
#
# Trigger:
#   gh workflow run db-ops.yml --ref main -f task=all

on:
  workflow_dispatch:
    inputs:
      task:
        description: 'Script to run'
        required: true
        default: all
        type: choice
        options:
          - all
          - migrate-deploy
          - backfill-wrong-note
          - backfill-diagnostic-gap
          - backfill-lesson-problem-set
          - verify-diagnostic-pools
          - backfill-insight-json
          - reclassify-chapter-mismatch
          - verify-chapter-mismatch
          - fix-no-correct-option
          - verify-no-correct-option

env:
  RESOURCE_GROUP: mathema-prod-cin
  PG_SERVER: mathema-pg-7ehvzqcd6c436
  KEY_VAULT: mathema-kv-7ehvzq

jobs:
  run-ops:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Allow runner IP on PostgreSQL (temporary)
        id: fw
        run: |
          RUNNER_IP=$(curl -sf https://api.ipify.org)
          test -n "$RUNNER_IP"
          RULE="gha-${{ github.run_id }}"
          echo "rule=$RULE" >> "$GITHUB_OUTPUT"
          echo "Runner IP: $RUNNER_IP"
          az postgres flexible-server firewall-rule create \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.PG_SERVER }} \
            --name "$RULE" \
            --start-ip-address "$RUNNER_IP" \
            --end-ip-address "$RUNNER_IP"

      # Source order: repo secret PROD_DATABASE_URL -> Key Vault (needs
      # Key Vault Secrets User on the SP) -> Container App secret value
      # (works only when stored as a direct value, not a keyvaultref).
      - name: Load DATABASE_URL
        env:
          PROD_DATABASE_URL: ${{ secrets.PROD_DATABASE_URL }}
        run: |
          URL="$PROD_DATABASE_URL"
          if [ -z "$URL" ]; then
            URL=$(az keyvault secret show \
              --vault-name ${{ env.KEY_VAULT }} \
              --name database-url \
              --query value -o tsv 2>kv_err.txt) || true
            if [ -z "$URL" ]; then
              echo "Key Vault read failed:"
              cat kv_err.txt
            fi
            rm -f kv_err.txt
          fi
          if [ -z "$URL" ]; then
            az extension add --name containerapp --upgrade -y 2>/dev/null
            URL=$(az containerapp secret list \
              --name mathema-backend \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --show-values \
              --query "[?name=='database-url'].value | [0]" -o tsv 2>aca_err.txt) || true
            if [ -z "$URL" ]; then
              echo "Container App secret read failed or secret is a keyvaultref:"
              cat aca_err.txt
              az containerapp secret list \
                --name mathema-backend \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query "[].name" -o tsv 2>/dev/null || true
            fi
            rm -f aca_err.txt
          fi
          test -n "$URL" || {
            echo "::error::Could not load DATABASE_URL. Fix one of: (a) grant the OIDC SP 'Key Vault Secrets User' on ${{ env.KEY_VAULT }}, or (b) set repo secret PROD_DATABASE_URL"
            exit 1
          }
          echo "::add-mask::$URL"
          echo "DATABASE_URL=$URL" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install server workspace
        run: npm ci --workspace=mathema-backend --include-workspace-root=false

      - name: Run selected task(s)
        working-directory: server
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -euo pipefail
          task="${{ inputs.task }}"
          run_wrong_note() { npm run backfill:wrong-note-review; }
          run_diagnostic_gap() { npm run backfill:diagnostic-gap; }
          run_lesson_set() { npx ts-node scripts/backfill-lesson-problem-set.ts; }
          run_verify() { npm run verify:diagnostic-pools; }
          run_insight_json() { npm run backfill:insight-json; }
          run_reclassify() {
            test -n "$GEMINI_API_KEY" || {
              echo "::error::Set repo secret GEMINI_API_KEY for reclassify-chapter-mismatch"
              exit 1
            }
            npm run reclassify:chapter-mismatch
          }
          run_verify_mismatch() {
            test -n "$GEMINI_API_KEY" || {
              echo "::error::Set repo secret GEMINI_API_KEY for verify-chapter-mismatch"
              exit 1
            }
            npm run verify:chapter-mismatch
          }
          run_fix_no_correct() { npm run fix:no-correct-option; }
          run_verify_no_correct() { npm run verify:no-correct-option; }
          run_migrate_deploy() {
            npx prisma migrate status || true
            npx prisma migrate deploy
            npx prisma migrate status
          }

          case "$task" in
            all)
              run_wrong_note
              run_diagnostic_gap
              run_lesson_set
              run_insight_json
              run_verify
              ;;
            migrate-deploy)            run_migrate_deploy ;;
            backfill-wrong-note)       run_wrong_note ;;
            backfill-diagnostic-gap)    run_diagnostic_gap ;;
            backfill-lesson-problem-set) run_lesson_set ;;
            backfill-insight-json)      run_insight_json ;;
            verify-diagnostic-pools)    run_verify ;;
            reclassify-chapter-mismatch) run_reclassify ;;
            verify-chapter-mismatch)    run_verify_mismatch ;;
            fix-no-correct-option)      run_fix_no_correct ;;
            verify-no-correct-option)   run_verify_no_correct ;;
            *) echo "Unknown task: $task"; exit 1 ;;
          esac

      - name: Remove temporary firewall rule
        if: always() && steps.fw.outputs.rule != ''
        run: |
          az postgres flexible-server firewall-rule delete \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --server-name ${{ env.PG_SERVER }} \
            --name "${{ steps.fw.outputs.rule }}" \
            --yes || true