name: Android Release (AAB)

# Build a signed Android App Bundle (AAB) for the Matheo app and upload it
# as a workflow artifact. Triggered manually or on a v* tag push.
# Backend / frontend deploys are handled by separate workflows.

on:
  workflow_dispatch:
    inputs:
      note:
        description: 'Release note (e.g. internal-testing G1)'
        required: false
        default: 'Internal testing build'
      version_code:
        description: 'Play versionCode (must be > the largest code already uploaded)'
        required: true
        type: string
  push:
    tags:
      - 'v*'

jobs:
  build-aab:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      MATHEO_KEY_ALIAS: matheo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Capacitor CLI 8.x requires Node >=22. Other workflows still
          # run Node 20 because the server is happy there; only this
          # workflow exercises `cap sync`.
          node-version: '22'
          cache: 'npm'

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install workspace deps
        run: npm ci

      - name: Require Google OAuth client ID
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: npm run android:require-google-client-id

      - name: Resolve and validate Play versionCode
        shell: bash
        env:
          DISPATCH_VERSION_CODE: ${{ inputs.version_code }}
        run: |
          version_code="$DISPATCH_VERSION_CODE"
          if [[ -z "$version_code" && "$GITHUB_REF_TYPE" == "tag" ]]; then
            # Tag builds must use v<semver>+<versionCode>, for example:
            # v1.0.1+2026071501
            version_code="${GITHUB_REF_NAME##*+}"
          fi
          if [[ ! "$version_code" =~ ^[1-9][0-9]{0,9}$ ]]; then
            echo "Invalid/missing versionCode. Dispatch with version_code or tag as v<semver>+<versionCode>." >&2
            exit 1
          fi
          if (( version_code <= 2026062102 || version_code > 2100000000 )); then
            echo "versionCode must be > 2026062102 and <= 2100000000; got $version_code." >&2
            exit 1
          fi
          echo "ANDROID_VERSION_CODE=$version_code" >> "$GITHUB_ENV"

      - name: Require Firebase Android config
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_SERVICES_JSON_BASE64" || {
            echo "GOOGLE_SERVICES_JSON_BASE64 is required for FCM-enabled release builds." >&2
            exit 1
          }
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > app/android/app/google-services.json
          node -e "const f=require('./app/android/app/google-services.json'); const p=f.client?.flatMap(c=>c.client_info?.android_client_info?.package_name?[c.client_info.android_client_info.package_name]:[])??[]; if(!p.includes('ai.matheo.app')) throw new Error('google-services.json does not contain ai.matheo.app')"

      - name: Build Vite SPA
        env:
          # Capacitor Android bundles the SPA into the AAB. Without this
          # the built app falls back to '/api/v1' (relative) and the
          # WebView resolves it as https://localhost/api/v1 — which is
          # the WebView itself, so every API call dies with "서버 연결
          # 불가". app/.env.production is gitignored and only affects
          # local Capacitor builds; CI has to inject the value here the
          # same way the frontend SWA workflow does.
          VITE_API_BASE_URL: https://mathema-backend.redcoast-6e6508a7.centralindia.azurecontainerapps.io/api/v1
          # OAuth Web Client ID — when unset the Google button is hidden.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_BILLING_ENABLED: ${{ secrets.BILLING_UI_ENABLED }}
        run: npm -w app run build

      - name: Capacitor sync (android)
        run: npm -w app exec cap sync android

      # Decode the base64-encoded keystore secret to the location the Gradle
      # signing config expects. Keep the file path stable so the Capacitor
      # android project can find it via the MATHEO_* env vars below.
      - name: Decode keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > app/android/app/matheo-release.jks

      - name: Build release bundle
        working-directory: app/android
        env:
          MATHEO_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MATHEO_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          MATHEO_KEY_ALIAS: matheo
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # Resolved above from an explicit dispatch input or a numeric tag
          # suffix. github.run_number is intentionally not used: the live Play
          # track already has date-based codes in the 2,026,xxx,xxx range.
          ANDROID_VERSION_CODE: ${{ env.ANDROID_VERSION_CODE }}
        run: |
          # gradlew loses its +x bit when committed from Windows; restore it.
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: matheo-aab
          path: app/android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30

      # G1 upload (manual): Play Console → Testing → Internal testing →
      # Create new release → upload matheo-aab artifact from this workflow.
      # Preflight: npm run billing:preflight && GET /admin/billing/readiness
      # Checklist: PLAY_BILLING_GATES.md §G1
      #
      # Future: automatic upload via r0adkll/upload-google-play@v1
      #   track: internal
      #   serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
