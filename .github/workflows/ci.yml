name: CI

# Runs on every PR + every push to main. Gates merges on:
#   - server typecheck (no || true mask, see P1-8)
#   - server jest unit suite + coverage threshold
#   - frontend tsc + vite build
#
# Unit tests mock Prisma / Redis / external HTTP, so no DB / Redis sidecars
# are required. The deterministic-check benchmark spec is excluded via the
# testPathIgnorePatterns in server/package.json's jest config -- it needs
# fixture files not present in the repo (copyrighted NCERT extracts).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server:
    name: server (typecheck + jest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Typecheck (server only -- frontend in separate job)
        working-directory: server
        run: npm run typecheck

      - name: DIAGNOSTIC pool gate (unit — no DB required)
        working-directory: server
        run: npx jest src/modules/diagnostic/diagnostic-pool-gate.spec.ts --runInBand

      - name: Jest with coverage
        working-directory: server
        env:
          # Disable the live pwnedpasswords call in CI -- the spec mocks fetch,
          # but defensive in case any new spec forgets.
          PWNED_PASSWORDS_DISABLED: 'true'
          # ts-jest + the full NestJS DI graph push v8's heap past the default
          # ~2 GB on ubuntu-latest (7 GB available) and the job OOMs without
          # any test actually failing. Cap to 4 GB so the kill happens with
          # a real signal, and so headroom is left for the runner's other
          # processes.
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npx jest --coverage --runInBand

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage
          if-no-files-found: ignore
          retention-days: 14

      # Content-quality validator (CONTENT_QUALITY_RUBRIC.md gate). Runs in
      # --warn-only mode so the gradual chapter-by-chapter upgrade can land
      # without blocking unrelated PRs. Drop --warn-only once Batch N covers
      # the whole curriculum. Also flags the unescaped-single-quote class of
      # syntax break that bit class-8/9/10 during the 2026-06-14 Batch 1.
      - name: Content rubric validator (warn-only)
        working-directory: server
        run: npx ts-node scripts/validate-content-rubric.ts --warn-only

  app:
    name: app (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit -p tsconfig.json

      - name: Vite production build
        working-directory: app
        env:
          # Production-shaped build with no real API target; just exercises
          # the bundler + tree-shake + asset pipeline.
          VITE_API_BASE_URL: '/api/v1'
        run: npm run build

      - name: Billing kill-switch unit tests
        working-directory: app
        run: npm run test

  android-compile:
    name: android (debug Java compile)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [app]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: android-actions/setup-android@v3

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Build Vite SPA for Capacitor
        working-directory: app
        env:
          VITE_API_BASE_URL: '/api/v1'
        run: npm run build

      - name: Capacitor sync (android)
        working-directory: app
        run: npx cap sync android

      - name: Compile debug Java (catches BOM / BillingPlugin errors)
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew :app:compileDebugJavaWithJavac --no-daemon

  e2e-smoke:
    name: app (playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [server, app]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (public SPA — no backend sidecar)
        working-directory: app
        env:
          CI: 'true'
          ENABLE_DEV_LOGIN: 'true'
          NODE_ENV: development
          PWNED_PASSWORDS_DISABLED: 'true'
          VITE_BILLING_ENABLED: 'true'
        run: npx playwright test e2e/smoke.spec.ts e2e/billing-paywall.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
