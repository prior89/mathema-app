name: CI

# Runs on every PR + every push to main. Gates merges on:
#   - server typecheck (no || true mask, see P1-8)
#   - server jest unit suite + coverage threshold
#   - frontend tsc + vite build
#
# Unit tests mock Prisma / Redis / external HTTP, so no DB / Redis sidecars
# are required. The deterministic-check benchmark spec is excluded via the
# testPathIgnorePatterns in server/package.json's jest config -- it needs
# fixture files not present in the repo (copyrighted NCERT extracts).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  server:
    name: server (typecheck + jest + coverage)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Typecheck (server only -- frontend in separate job)
        working-directory: server
        run: npm run typecheck

      - name: DIAGNOSTIC pool gate (unit — no DB required)
        working-directory: server
        run: npx jest src/modules/diagnostic/diagnostic-pool-gate.spec.ts --runInBand

      - name: Jest with coverage
        working-directory: server
        env:
          # Disable the live pwnedpasswords call in CI -- the spec mocks fetch,
          # but defensive in case any new spec forgets.
          PWNED_PASSWORDS_DISABLED: 'true'
          # ts-jest + the full NestJS DI graph push v8's heap past the default
          # ~2 GB on ubuntu-latest (7 GB available) and the job OOMs without
          # any test actually failing. Cap to 4 GB so the kill happens with
          # a real signal, and so headroom is left for the runner's other
          # processes.
          NODE_OPTIONS: '--max-old-space-size=4096'
        run: npx jest --coverage --runInBand

      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: server/coverage
          if-no-files-found: ignore
          retention-days: 14

  app:
    name: app (tsc + vite build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Typecheck
        working-directory: app
        run: npx tsc --noEmit -p tsconfig.json

      - name: Vite production build
        working-directory: app
        env:
          # Production-shaped build with no real API target; just exercises
          # the bundler + tree-shake + asset pipeline.
          VITE_API_BASE_URL: '/api/v1'
        run: npm run build

  e2e-smoke:
    name: app (playwright smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [server, app]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci --workspaces --include-workspace-root

      - name: Generate Prisma client
        working-directory: server
        run: npx prisma generate

      - name: Install Playwright Chromium
        working-directory: app
        run: npx playwright install --with-deps chromium

      - name: Playwright smoke (public flows + health)
        working-directory: app
        env:
          CI: 'true'
          ENABLE_DEV_LOGIN: 'true'
          NODE_ENV: development
          PWNED_PASSWORDS_DISABLED: 'true'
        run: npx playwright test e2e/smoke.spec.ts --project=chromium

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: app/playwright-report
          retention-days: 7
