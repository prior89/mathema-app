name: Math-helper build and deploy to Azure Container Apps

# Build the Python FastAPI image, push to ACR, update the
# mathema-math-helper Container App revision. Triggered on pushes to main
# that touch services/math-helper/ or services/data/ or this workflow.

on:
  push:
    branches: [main]
    paths:
      - 'services/math-helper/**'
      - 'services/data/**'
      - '.github/workflows/math-helper-deploy.yml'
  workflow_dispatch:

env:
  ACR_NAME: mathemaacr7ehvzqcd6c436
  RESOURCE_GROUP: mathema-prod-cin
  CONTAINER_APP: mathema-math-helper
  IMAGE_NAME: mathema-math-helper

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Docker build and push
        run: |
          docker build \
            -f services/math-helper/Dockerfile \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      - name: Ensure OpenAI secret reference
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            az containerapp secret set \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets "openai-api-key=$OPENAI_API_KEY"
          else
            KV_NAME=$(az keyvault list \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[?starts_with(name, 'mathema-kv-')].name | [0]" -o tsv)
            KV_URI=$(az keyvault show --name "$KV_NAME" --query properties.vaultUri -o tsv)
            az containerapp secret set \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets "openai-api-key=keyvaultref:${KV_URI}secrets/openai-api-key,identityref:system"
          fi

      - name: Container App revision update
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            --set-env-vars \
              OPENAI_API_KEY=secretref:openai-api-key \
              MATH_HELPER_MODEL=gpt-5.4-mini \
              MATH_HELPER_FALLBACK_MODEL=gpt-5.5

      # The math-helper app has internal ingress, so GitHub runners cannot curl
      # it directly. A 401 from /math-helper/health only proves the NestJS guard
      # ran. This smoke test registers a temporary user and solves a problem
      # that requires the LLM path, so stale OpenAI secrets fail the workflow.
      - name: Smoke test LLM solve via backend proxy
        run: |
          BACKEND_FQDN=$(az containerapp show \
            -n mathema-backend -g ${{ env.RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          API="https://$BACKEND_FQDN/api/v1"
          ok=0
          for i in $(seq 1 18); do
            sleep 10
            email="math-helper-smoke-${GITHUB_RUN_ID}-${i}@matheo.test"
            password="Smoke!${GITHUB_RUN_ID}${i}"
            reg=$(curl -sS --max-time 20 -X POST "$API/auth/register" \
              -H "Content-Type: application/json" \
              -d "{\"email\":\"$email\",\"password\":\"$password\",\"name\":\"MathHelperSmoke\",\"role\":\"STUDENT\",\"gradeLevel\":\"CLASS_11\"}" || true)
            token=$(REG_JSON="$reg" python3 -c 'import json, os; print((json.loads(os.environ.get("REG_JSON", "{}")).get("data") or {}).get("accessToken") or "")' 2>/dev/null || true)
            if [ -z "$token" ]; then
              echo "attempt $i -> register failed"
              continue
            fi
            body=$(curl -sS --max-time 90 -X POST "$API/math-helper/solve" \
              -H "Authorization: Bearer $token" \
              -H "Content-Type: application/json" \
              -d '{"classLevel":11,"question":"Find the derivative of x^2."}' \
              -w "\nHTTP_CODE:%{http_code}" || true)
            curl -sS --max-time 10 -X DELETE "$API/users/me" \
              -H "Authorization: Bearer $token" >/dev/null || true
            code=$(printf '%s' "$body" | tail -1 | sed 's/HTTP_CODE://')
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "201" ]; then
              ok=1
              break
            fi
          done
          if [ "$ok" = "1" ]; then
            echo "::notice::math-helper revision solved an LLM problem (HTTP $code)."
            exit 0
          fi
          echo "::error::math-helper did not solve an LLM smoke problem within 3 min -- dumping container logs"
          az containerapp logs show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --type=console --tail 100 || true
          exit 1
