name: Stop backend (scale Container Apps to 0)

# Manually-triggered teardown for the compute layer.
# Scales mathema-backend and mathema-math-helper to min=0/max=0 so no
# replicas run and consumption-tier billing drops to zero. Definitions,
# secrets, images, env vars are preserved — bring back with start-backend.

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  stop:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      # ACA refuses --max-replicas 0 ("must be in range [1,1000]"). Smallest
      # legal config is min=0/max=1 — idle replicas drop to 0 so compute cost
      # is 0; but a stray external request would still spin up 1 replica. We
      # additionally disable ingress so no traffic can reach either app.

      - name: Scale backend → 0/1 + disable ingress
        run: |
          az containerapp update -n mathema-backend -g mathema-prod-cin \
            --min-replicas 0 --max-replicas 1
          az containerapp ingress disable -n mathema-backend -g mathema-prod-cin || true

      - name: Scale math-helper → 0/1 + disable ingress
        run: |
          az containerapp update -n mathema-math-helper -g mathema-prod-cin \
            --min-replicas 0 --max-replicas 1
          az containerapp ingress disable -n mathema-math-helper -g mathema-prod-cin || true

      - name: Result
        run: |
          echo "::notice::Both Container Apps idled (min=0/max=1) and ingress disabled. No traffic served, no replicas running."
