name: Backend — build & deploy to Azure Container Apps

# Build the NestJS Docker image, push to ACR, update the Container App revision.
#
# Gating: this workflow is manual-trigger-only. Pushing to main runs ci.yml
# (validation) but does NOT auto-deploy. To deploy, run:
#   gh workflow run backend-deploy.yml --ref main
# This is the no-paid-plan equivalent of an Environment + required reviewer
# gate (GH free tier doesn't support required reviewers on private repos).

on:
  workflow_dispatch:

concurrency:
  group: mathema-production-backend
  cancel-in-progress: false

env:
  ACR_NAME: mathemaacr7ehvzqcd6c436
  RESOURCE_GROUP: mathema-prod-cin
  CONTAINER_APP: mathema-backend
  IMAGE_NAME: mathema-backend
  # Public OAuth identifier (not a client secret). Frontend, Android Credential
  # Manager and backend token verification must all use this exact Web client.
  EXPECTED_GOOGLE_WEB_CLIENT_ID: 780610015758-4sfjjjhtq6p86edr5bsdn5c9b95uav1b.apps.googleusercontent.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # `id-token: write` is required for OIDC federation — the runner asks GitHub
    # for a short-lived token signed by GitHub's OIDC issuer, then exchanges it
    # at Azure AD for an access token. No long-lived client secret in GH.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Require production Google OAuth client
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: node scripts/require-google-client-id.cjs

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Capture build metadata for /api/v1/health/version (release inventory).
      # ISO-8601 UTC matches org.opencontainers.image.created convention.
      - name: Compute build metadata
        id: meta
        run: |
          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "release_id=${{ github.run_id }}-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      # Mail is part of account verification, password recovery, guardian
      # consent, and parent linking. Fail before building or changing Azure if
      # any required value is absent or malformed. Values are GitHub secrets
      # and are deliberately never printed.
      - name: Preflight required SMTP configuration
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          set -euo pipefail
          missing=()
          for name in SMTP_HOST SMTP_PORT SMTP_SECURE SMTP_USER SMTP_PASS MAIL_FROM; do
            if [ -z "${!name:-}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -ne 0 ]; then
            echo "::error::Missing required GitHub secret(s): ${missing[*]}"
            exit 1
          fi
          if ! [[ "$SMTP_PORT" =~ ^[0-9]+$ ]] || [ "$SMTP_PORT" -lt 1 ] || [ "$SMTP_PORT" -gt 65535 ]; then
            echo "::error::SMTP_PORT must be an integer between 1 and 65535"
            exit 1
          fi
          case "${SMTP_SECURE,,}" in
            true|false) ;;
            *) echo "::error::SMTP_SECURE must be true or false"; exit 1 ;;
          esac
          if [ "$SMTP_PORT" = "465" ] && [ "${SMTP_SECURE,,}" != "true" ]; then
            echo "::error::SMTP_SECURE must be true when SMTP_PORT is 465"
            exit 1
          fi
          if [[ "$MAIL_FROM" != *"@"* ]]; then
            echo "::error::MAIL_FROM must contain a sender email address"
            exit 1
          fi
          echo "SMTP secret presence and formats verified (values remain masked)."

      # Dockerfile is monorepo-aware — build context is the repo root so it can
      # see the workspace package-lock.json and copy both root + server/package.json.
      # --build-arg trio threads release inventory into the image so the
      # /health/version endpoint can report the live SHA without guesswork.
      - name: Docker build
        run: |
          docker build \
            -f server/Dockerfile \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=${{ steps.meta.outputs.build_time }} \
            --build-arg RELEASE_ID=${{ steps.meta.outputs.release_id }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .

      # nodemailer.verify() performs connection/TLS/authentication without
      # sending a message. Passing env names (not values) keeps credentials out
      # of the command line and workflow output.
      - name: Verify SMTP connection and credentials
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          docker run --rm \
            -e SMTP_HOST \
            -e SMTP_PORT \
            -e SMTP_SECURE \
            -e SMTP_USER \
            -e SMTP_PASS \
            -e MAIL_FROM \
            ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            node scripts/verify-smtp.cjs

      - name: Docker push
        run: |
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      # Microsoft.App provider is pre-registered on the subscription (done
      # once via the owner identity in Cloud Shell — the workflow's service
      # principal only has RG-scoped Contributor and can't write at the
      # subscription level).
      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      # OCR uses Mathpix first when configured, with OpenAI fallback / graph
      # repair. Hint walkthrough and math-helper solve still call OpenAI.
      # Gemini was removed 2026-06-12: its API terms prohibit clients
      # directed at under-18 users, which covers our student-facing features.

      # Repo secret takes precedence: the KV copy of openai-api-key went
      # stale (prod served 401s on 2026-06-12) and the SP cannot write KV
      # data plane to fix it. Falls back to the KV reference when the repo
      # secret is unset.
      - name: Ensure OpenAI secret reference
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -n "$OPENAI_API_KEY" ]; then
            az containerapp secret set \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets "openai-api-key=$OPENAI_API_KEY"
          else
            KV_NAME=$(az keyvault list \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "[?starts_with(name, 'mathema-kv')].name | [0]" -o tsv)
            test -n "$KV_NAME"
            KV_URI=$(az keyvault show \
              --name "$KV_NAME" \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query properties.vaultUri -o tsv)
            az containerapp secret set \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --secrets "openai-api-key=keyvaultref:${KV_URI}secrets/openai-api-key,identityref:system"
          fi

      # Mathpix OCR secrets. Both values are required; otherwise backend
      # intentionally stays on OpenAI OCR fallback instead of half-configuring
      # Mathpix and failing student uploads at runtime.
      - name: Ensure Mathpix secret references
        env:
          MATHPIX_APP_ID: ${{ secrets.MATHPIX_APP_ID }}
          MATHPIX_APP_KEY: ${{ secrets.MATHPIX_APP_KEY }}
        run: |
          if [ -z "$MATHPIX_APP_ID" ] || [ -z "$MATHPIX_APP_KEY" ]; then
            echo "::warning::MATHPIX_APP_ID / MATHPIX_APP_KEY not both configured; Mathpix OCR will stay disabled for this revision."
            exit 0
          fi
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "mathpix-app-id=${MATHPIX_APP_ID}" \
              "mathpix-app-key=${MATHPIX_APP_KEY}"

      # FCM push — GitHub secrets → Container App secrets (no-op when unset).
      - name: Ensure Firebase secret references
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_CLIENT_EMAIL" ] || [ -z "$FIREBASE_PRIVATE_KEY" ]; then
            echo "Firebase secrets not configured — skipping FCM secret sync"
            exit 0
          fi
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "firebase-project-id=${FIREBASE_PROJECT_ID}" \
              "firebase-client-email=${FIREBASE_CLIENT_EMAIL}" \
              "firebase-private-key=${FIREBASE_PRIVATE_KEY}"

      # Play Developer API service account JSON — server-side purchase verify.
      # Large multi-line value, so routed through an ACA secret rather than a
      # direct env var. No-op when the GitHub secret is unset.
      - name: Ensure Play service account secret reference
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "PLAY_SERVICE_ACCOUNT_JSON not configured — skipping Play SA secret sync"
            exit 0
          fi
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "play-service-account-json=${PLAY_SERVICE_ACCOUNT_JSON}"

      # Keep SMTP credentials and sender configuration in Container App
      # secrets. The revision receives secretRef bindings only; no SMTP value
      # is written into the workflow log or plain-text Container App env.
      - name: Ensure SMTP secret references
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
        run: |
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "smtp-host=${SMTP_HOST}" \
              "smtp-port=${SMTP_PORT}" \
              "smtp-secure=${SMTP_SECURE}" \
              "smtp-user=${SMTP_USER}" \
              "smtp-pass=${SMTP_PASS}" \
              "mail-from=${MAIL_FROM}"

      - name: Container App revision update
        env:
          MATHPIX_APP_ID: ${{ secrets.MATHPIX_APP_ID }}
          MATHPIX_APP_KEY: ${{ secrets.MATHPIX_APP_KEY }}
        run: |
          ENV_VARS="OPENAI_API_KEY=secretref:openai-api-key"
          ENV_VARS="$ENV_VARS SMTP_HOST=secretref:smtp-host"
          ENV_VARS="$ENV_VARS SMTP_PORT=secretref:smtp-port"
          ENV_VARS="$ENV_VARS SMTP_SECURE=secretref:smtp-secure"
          ENV_VARS="$ENV_VARS SMTP_USER=secretref:smtp-user"
          ENV_VARS="$ENV_VARS SMTP_PASS=secretref:smtp-pass"
          ENV_VARS="$ENV_VARS MAIL_FROM=secretref:mail-from"
          ENV_VARS="$ENV_VARS AI_OCR_MODEL=gpt-4o-mini"
          ENV_VARS="$ENV_VARS AI_OCR_FALLBACK_MODEL=gpt-5.4-mini"
          ENV_VARS="$ENV_VARS AI_OCR_GRAPH_MODEL=gpt-5.4-mini"
          ENV_VARS="$ENV_VARS OCR_GRAPH_ENHANCEMENT=true"
          ENV_VARS="$ENV_VARS MATHPIX_TIMEOUT_MS=180000"
          if [ -n "$MATHPIX_APP_ID" ] && [ -n "$MATHPIX_APP_KEY" ]; then
            ENV_VARS="$ENV_VARS OCR_PRIMARY_PROVIDER=mathpix"
            ENV_VARS="$ENV_VARS MATHPIX_APP_ID=secretref:mathpix-app-id"
            ENV_VARS="$ENV_VARS MATHPIX_APP_KEY=secretref:mathpix-app-key"
          else
            ENV_VARS="$ENV_VARS OCR_PRIMARY_PROVIDER=openai"
          fi
          # Force concept-lessons bootstrap to re-sync seed content on every
          # deploy. Without this, the bootstrap short-circuits when the row
          # count already matches NCERT_CHAPTERS, so edits to seed files
          # (workedSteps narration, fade flags, visualData payloads, etc.)
          # never reach prod. Sync runs in setImmediate() so it does not
          # block /listen and the ~5s + ~1100 query cost is amortised over
          # the deploy window.
          ENV_VARS="$ENV_VARS FORCE_CONCEPT_SYNC=1"
          ENV_VARS="$ENV_VARS FEATURE_ADAPTIVE_DIAGNOSTIC_PCT=100"
          ENV_VARS="$ENV_VARS FEATURE_FIRST_SESSION_ACHIEVEMENT_PCT=100"
          ENV_VARS="$ENV_VARS FEATURE_KR_COLD_START_PCT=100"
          ENV_VARS="$ENV_VARS FEATURE_STUDENT_EFFICACY_CARD_PCT=100"
          # Guest-first onboarding (try-first) — launch checklist #2. Recovers
          # ~25pt of activation vs the signup wall. Server-served flag: the app
          # reads it at runtime, so flipping it only needs a backend deploy.
          ENV_VARS="$ENV_VARS FEATURE_GUEST_MODE_PCT=100"
          if [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            ENV_VARS="$ENV_VARS FIREBASE_PROJECT_ID=secretref:firebase-project-id"
            ENV_VARS="$ENV_VARS FIREBASE_CLIENT_EMAIL=secretref:firebase-client-email"
            ENV_VARS="$ENV_VARS FIREBASE_PRIVATE_KEY=secretref:firebase-private-key"
          fi
          ENV_VARS="$ENV_VARS GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
          ENV_VARS="$ENV_VARS PLAY_PACKAGE_NAME=ai.matheo.app"
          # Billing UI switch — set GitHub secret BILLING_UI_ENABLED=true to
          # expose paywall / upgrade CTAs without a frontend rebuild.
          if [ -n "${{ secrets.BILLING_UI_ENABLED }}" ]; then
            ENV_VARS="$ENV_VARS BILLING_UI_ENABLED=${{ secrets.BILLING_UI_ENABLED }}"
          fi
          # Play RTDN — set after Pub/Sub topic + push subscription exist.
          if [ -n "${{ secrets.RTDN_AUDIENCE }}" ]; then
            ENV_VARS="$ENV_VARS RTDN_AUDIENCE=${{ secrets.RTDN_AUDIENCE }}"
          fi
          if [ -n "${{ secrets.RTDN_SERVICE_ACCOUNT_EMAIL }}" ]; then
            ENV_VARS="$ENV_VARS RTDN_SERVICE_ACCOUNT_EMAIL=${{ secrets.RTDN_SERVICE_ACCOUNT_EMAIL }}"
          fi
          if [ -n "${{ secrets.PLAY_OBFUSCATED_ACCOUNT_SECRET }}" ]; then
            ENV_VARS="$ENV_VARS PLAY_OBFUSCATED_ACCOUNT_SECRET=${{ secrets.PLAY_OBFUSCATED_ACCOUNT_SECRET }}"
          fi
          if [ -n "${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}" ]; then
            ENV_VARS="$ENV_VARS PLAY_SERVICE_ACCOUNT_JSON=secretref:play-service-account-json"
          fi
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            --set-env-vars $ENV_VARS

      - name: Verify deployed SMTP secret bindings
        run: |
          set -euo pipefail
          assert_secret_ref() {
            local env_name="$1"
            local expected_ref="$2"
            local actual_ref
            actual_ref=$(az containerapp show \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.template.containers[0].env[?name=='${env_name}'].secretRef | [0]" \
              -o tsv)
            if [ "$actual_ref" != "$expected_ref" ]; then
              echo "::error::${env_name} is not bound to the expected Container App secret"
              exit 1
            fi
          }

          assert_secret_ref SMTP_HOST smtp-host
          assert_secret_ref SMTP_PORT smtp-port
          assert_secret_ref SMTP_SECURE smtp-secure
          assert_secret_ref SMTP_USER smtp-user
          assert_secret_ref SMTP_PASS smtp-pass
          assert_secret_ref MAIL_FROM mail-from
          echo "SMTP Container App secretRef bindings verified."

      - name: Verify deployed Google OAuth audience
        run: |
          actual_client_id=$(az containerapp show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "properties.template.containers[0].env[?name=='GOOGLE_CLIENT_ID'].value | [0]" \
            -o tsv)
          if [ "$actual_client_id" != "$EXPECTED_GOOGLE_WEB_CLIENT_ID" ]; then
            echo "::error::Container App GOOGLE_CLIENT_ID does not match the production OAuth Web client"
            exit 1
          fi
          echo "Google OAuth audience binding verified."

      # Bounded smoke test: poll every 10s, give up after 2min, then dump the
      # last 100 log lines of the new revision so we can see the real cause
      # without having to open the portal. `curl --max-time` caps each call
      # so a hung backend (504 from the Container Apps gateway) doesn't burn
      # the whole job.
      - name: Smoke test
        run: |
          set -uo pipefail

          # Resolve FQDN with retries + fallback. The `az containerapp update`
          # above can return before ingress metadata is fully propagated, so
          # the first show call sometimes returns an empty string. Also try
          # latestRevisionFqdn as a fallback in case the ingress.fqdn path
          # is stale for the new revision.
          BACKEND_URL=""
          for i in $(seq 1 6); do
            BACKEND_URL=$(az containerapp show \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
            if [ -z "$BACKEND_URL" ]; then
              BACKEND_URL=$(az containerapp show \
                --name ${{ env.CONTAINER_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query "properties.latestRevisionFqdn" -o tsv 2>/dev/null || true)
            fi
            if [ -n "$BACKEND_URL" ]; then
              echo "Resolved FQDN on attempt $i: $BACKEND_URL"
              break
            fi
            echo "FQDN fetch attempt $i empty, retrying in 5s..."
            sleep 5
          done

          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Could not resolve Container App FQDN — dumping containerapp show for diagnosis"
            az containerapp show \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.configuration.ingress" -o json || true
            exit 1
          fi

          echo "Backend URL: https://$BACKEND_URL"

          # Wait for /health/live (revision warm-up) before the 9-item suite.
          ok=0
          for i in $(seq 1 12); do
            sleep 10
            code=$(curl -s -o /dev/null --max-time 8 -w "%{http_code}" "https://$BACKEND_URL/api/v1/health/live" || echo "000")
            echo "warm-up attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
          done
          if [ "$ok" != "1" ]; then
            echo "::error::Backend did not become healthy within 2 min — dumping container logs"
            az containerapp logs show \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --type=console --tail 100 || true
            exit 1
          fi

          # Full 9-item prod smoke when learner creds are configured; otherwise
          # the warm-up above is the only gate (secrets are operator-provided).
          if [ -n "${{ secrets.SMOKE_USER_EMAIL }}" ] && [ -n "${{ secrets.SMOKE_USER_PASSWORD }}" ]; then
            echo "Running scripts/smoke-prod.sh (9 items)…"
            bash scripts/smoke-prod.sh \
              "https://$BACKEND_URL" \
              "${{ secrets.SMOKE_USER_EMAIL }}" \
              "${{ secrets.SMOKE_USER_PASSWORD }}" \
              "${{ secrets.SMOKE_ADMIN_EMAIL }}" \
              "${{ secrets.SMOKE_ADMIN_PASSWORD }}"
          else
            echo "::notice::SMOKE_USER_EMAIL / SMOKE_USER_PASSWORD not set — skipping 9-item smoke (live check passed)"
          fi
