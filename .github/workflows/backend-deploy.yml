name: Backend — build & deploy to Azure Container Apps

# Build the NestJS Docker image, push to ACR, update the Container App revision.
#
# Gating: this workflow is manual-trigger-only. Pushing to main runs ci.yml
# (validation) but does NOT auto-deploy. To deploy, run:
#   gh workflow run backend-deploy.yml --ref main
# This is the no-paid-plan equivalent of an Environment + required reviewer
# gate (GH free tier doesn't support required reviewers on private repos).

on:
  workflow_dispatch:

env:
  ACR_NAME: mathemaacr7ehvzqcd6c436
  RESOURCE_GROUP: mathema-prod-cin
  CONTAINER_APP: mathema-backend
  IMAGE_NAME: mathema-backend

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # `id-token: write` is required for OIDC federation — the runner asks GitHub
    # for a short-lived token signed by GitHub's OIDC issuer, then exchanges it
    # at Azure AD for an access token. No long-lived client secret in GH.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Capture build metadata for /api/v1/health/version (release inventory).
      # ISO-8601 UTC matches org.opencontainers.image.created convention.
      - name: Compute build metadata
        id: meta
        run: |
          {
            echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "release_id=${{ github.run_id }}-${GITHUB_SHA::7}"
          } >> "$GITHUB_OUTPUT"

      # Dockerfile is monorepo-aware — build context is the repo root so it can
      # see the workspace package-lock.json and copy both root + server/package.json.
      # --build-arg trio threads release inventory into the image so the
      # /health/version endpoint can report the live SHA without guesswork.
      - name: Docker build & push
        run: |
          docker build \
            -f server/Dockerfile \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME=${{ steps.meta.outputs.build_time }} \
            --build-arg RELEASE_ID=${{ steps.meta.outputs.release_id }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest \
            .
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }}
          docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:latest

      # Microsoft.App provider is pre-registered on the subscription (done
      # once via the owner identity in Cloud Shell — the workflow's service
      # principal only has RG-scoped Contributor and can't write at the
      # subscription level).
      - name: Install containerapp extension
        run: az extension add --name containerapp --upgrade -y

      # Legacy OCR secret-sync steps removed 2026-05-22: OCR stack was migrated
      # OCR now uses the shared Gemini Key Vault secret. Legacy OCR vendor
      # secret-sync steps were removed so deploys do not depend on unused
      # Key Vault writes.

      - name: Ensure Gemini secret reference
        run: |
          KV_NAME=$(az keyvault list \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?starts_with(name, 'mathema-kv')].name | [0]" -o tsv)
          test -n "$KV_NAME"
          KV_URI=$(az keyvault show \
            --name "$KV_NAME" \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query properties.vaultUri -o tsv)
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets "gemini-api-key=keyvaultref:${KV_URI}secrets/gemini-api-key,identityref:system"

      # FCM push — GitHub secrets → Container App secrets (no-op when unset).
      - name: Ensure Firebase secret references
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CLIENT_EMAIL: ${{ secrets.FIREBASE_CLIENT_EMAIL }}
          FIREBASE_PRIVATE_KEY: ${{ secrets.FIREBASE_PRIVATE_KEY }}
        run: |
          if [ -z "$FIREBASE_PROJECT_ID" ] || [ -z "$FIREBASE_CLIENT_EMAIL" ] || [ -z "$FIREBASE_PRIVATE_KEY" ]; then
            echo "Firebase secrets not configured — skipping FCM secret sync"
            exit 0
          fi
          az containerapp secret set \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --secrets \
              "firebase-project-id=${FIREBASE_PROJECT_ID}" \
              "firebase-client-email=${FIREBASE_CLIENT_EMAIL}" \
              "firebase-private-key=${FIREBASE_PRIVATE_KEY}"

      - name: Container App revision update
        run: |
          ENV_VARS="GEMINI_API_KEY=secretref:gemini-api-key"
          ENV_VARS="$ENV_VARS FEATURE_ADAPTIVE_DIAGNOSTIC_PCT=100"
          ENV_VARS="$ENV_VARS FEATURE_FIRST_SESSION_ACHIEVEMENT_PCT=100"
          ENV_VARS="$ENV_VARS FEATURE_KR_COLD_START_PCT=100"
          ENV_VARS="$ENV_VARS FEATURE_STUDENT_EFFICACY_CARD_PCT=100"
          if [ -n "${{ secrets.FIREBASE_PROJECT_ID }}" ]; then
            ENV_VARS="$ENV_VARS FIREBASE_PROJECT_ID=secretref:firebase-project-id"
            ENV_VARS="$ENV_VARS FIREBASE_CLIENT_EMAIL=secretref:firebase-client-email"
            ENV_VARS="$ENV_VARS FIREBASE_PRIVATE_KEY=secretref:firebase-private-key"
          fi
          if [ -n "${{ secrets.VITE_GOOGLE_CLIENT_ID }}" ]; then
            ENV_VARS="$ENV_VARS GOOGLE_CLIENT_ID=${{ secrets.VITE_GOOGLE_CLIENT_ID }}"
          fi
          # Billing UI switch — set GitHub secret BILLING_UI_ENABLED=true to
          # expose paywall / upgrade CTAs without a frontend rebuild.
          if [ -n "${{ secrets.BILLING_UI_ENABLED }}" ]; then
            ENV_VARS="$ENV_VARS BILLING_UI_ENABLED=${{ secrets.BILLING_UI_ENABLED }}"
          fi
          az containerapp update \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ steps.tag.outputs.tag }} \
            --set-env-vars $ENV_VARS

      # Bounded smoke test: poll every 10s, give up after 2min, then dump the
      # last 100 log lines of the new revision so we can see the real cause
      # without having to open the portal. `curl --max-time` caps each call
      # so a hung backend (504 from the Container Apps gateway) doesn't burn
      # the whole job.
      - name: Smoke test
        run: |
          set -uo pipefail

          # Resolve FQDN with retries + fallback. The `az containerapp update`
          # above can return before ingress metadata is fully propagated, so
          # the first show call sometimes returns an empty string. Also try
          # latestRevisionFqdn as a fallback in case the ingress.fqdn path
          # is stale for the new revision.
          BACKEND_URL=""
          for i in $(seq 1 6); do
            BACKEND_URL=$(az containerapp show \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.configuration.ingress.fqdn" -o tsv 2>/dev/null || true)
            if [ -z "$BACKEND_URL" ]; then
              BACKEND_URL=$(az containerapp show \
                --name ${{ env.CONTAINER_APP }} \
                --resource-group ${{ env.RESOURCE_GROUP }} \
                --query "properties.latestRevisionFqdn" -o tsv 2>/dev/null || true)
            fi
            if [ -n "$BACKEND_URL" ]; then
              echo "Resolved FQDN on attempt $i: $BACKEND_URL"
              break
            fi
            echo "FQDN fetch attempt $i empty, retrying in 5s..."
            sleep 5
          done

          if [ -z "$BACKEND_URL" ]; then
            echo "::error::Could not resolve Container App FQDN — dumping containerapp show for diagnosis"
            az containerapp show \
              --name ${{ env.CONTAINER_APP }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --query "properties.configuration.ingress" -o json || true
            exit 1
          fi

          echo "Backend URL: https://$BACKEND_URL"
          ok=0
          for i in $(seq 1 12); do
            sleep 10
            code=$(curl -s -o /dev/null --max-time 8 -w "%{http_code}" "https://$BACKEND_URL/api/v1/health" || echo "000")
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then ok=1; break; fi
          done
          if [ "$ok" = "1" ]; then
            echo "::notice::Backend healthy at https://$BACKEND_URL/api/v1/health"
            exit 0
          fi
          echo "::error::Backend did not become healthy within 2 min — dumping container logs"
          az containerapp logs show \
            --name ${{ env.CONTAINER_APP }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --type=console --tail 100 || true
          exit 1
