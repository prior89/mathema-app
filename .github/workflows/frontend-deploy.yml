name: Frontend — build & deploy to Azure Static Web Apps

# Build the Vite SPA, deploy to SWA. Triggered on main pushes to app/ or this file.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

env:
  # Backend URL injected as VITE_API_BASE_URL at build time so the SPA calls
  # the right API host. Adjust if your Container App FQDN changes.
  VITE_API_BASE_URL: https://mathema-backend.redcoast-6e6508a7.centralindia.azurecontainerapps.io/api/v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      # Let the SWA action drive the build via its Oryx builder. It runs
      # npm install + npm run build inside the container, so VITE_API_BASE_URL
      # has to be in the action's env (Oryx forwards env vars to the build).
      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'app'
          output_location: 'dist'
          api_location: ''
