name: Frontend — build & deploy to Azure Static Web Apps

# Build the Vite SPA, deploy to SWA. Triggered on main pushes to app/ or this file.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

env:
  # Backend URL injected as VITE_API_BASE_URL at build time so the SPA calls
  # the right API host. Adjust if your Container App FQDN changes.
  VITE_API_BASE_URL: https://mathema-backend.redcoast-6e6508a7.centralindia.azurecontainerapps.io/api/v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace deps
        run: npm ci

      - name: Build Vite SPA
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: npm -w app run build

      # Fetch the canonical deployment token from Azure directly using the
      # same service principal we use for the backend. This removes any
      # chance that the stored AZURE_STATIC_WEB_APPS_API_TOKEN secret has
      # drifted from the actual SWA (rotation, recreate, wrong copy, etc.)
      # and is the root cause of the "An unknown exception" messages.
      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Resolve SWA deployment token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name mathema-swa \
            --resource-group mathema-prod-cin \
            --query "properties.apiKey" -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not fetch SWA deployment token"
            exit 1
          fi
          echo "token_len=${#TOKEN}"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Show SWA target (sanity)
        run: |
          az staticwebapp show \
            --name mathema-swa \
            --resource-group mathema-prod-cin \
            --query "{name:name, location:location, sku:sku.name, defaultHostname:defaultHostname, repositoryUrl:repositoryUrl}" \
            -o json

      - name: Deploy to Static Web Apps (swa CLI)
        run: |
          npx -y @azure/static-web-apps-cli@latest deploy ./app/dist \
            --deployment-token "${{ steps.swa.outputs.token }}" \
            --env production \
            --verbose silly
