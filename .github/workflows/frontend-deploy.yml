name: Frontend — build & deploy to Azure Static Web Apps

# Build the Vite SPA, deploy to SWA.
#
# Gating: manual-trigger-only to mirror backend-deploy.yml. Push to main runs
# ci.yml only; to ship a frontend, run:
#   gh workflow run frontend-deploy.yml --ref main

on:
  workflow_dispatch:

env:
  # Backend URL injected as VITE_API_BASE_URL at build time so the SPA calls
  # the right API host. Adjust if your Container App FQDN changes.
  VITE_API_BASE_URL: https://mathema-backend.redcoast-6e6508a7.centralindia.azurecontainerapps.io/api/v1
  PRODUCTION_ORIGIN: https://app.matheo.verastudy.net
  # Public OAuth identifier (not a client secret). Pin it so a missing or
  # accidentally replaced GitHub secret cannot silently remove Google login.
  EXPECTED_GOOGLE_WEB_CLIENT_ID: 780610015758-4sfjjjhtq6p86edr5bsdn5c9b95uav1b.apps.googleusercontent.com

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # `id-token: write` is required for OIDC federation — the runner exchanges
    # a short-lived GitHub OIDC token for an Azure AD access token. No
    # long-lived client secret in GH.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install workspace deps
        run: npm ci

      - name: Require production Google OAuth client
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: node scripts/require-google-client-id.cjs

      - name: Build Vite SPA
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
          # GitHub repo secret — OAuth Web Client ID from Cloud Console.
          # When unset the Google button is hidden; email/password still works.
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          # Optional: force billing UI on at build time (server BILLING_UI_ENABLED also works).
          VITE_BILLING_ENABLED: ${{ secrets.BILLING_UI_ENABLED }}
        run: npm -w app run build

      - name: Verify Google login is present in build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
        run: node scripts/require-google-client-id.cjs --artifact app/dist

      # Validate exactly what will be uploaded. In particular, every hashed
      # asset referenced by index.html must exist and legal Markdown must stay
      # outside the SPA fallback. This catches partial/stale artifact layouts
      # before production is touched.
      - name: Verify static deployment artifact
        run: node scripts/verify-static-site.mjs --artifact app/dist

      # OIDC login — fetches the canonical SWA deployment token from Azure so
      # the stored GH secret can't drift from the actual SWA (rotation,
      # recreate, wrong copy, etc.).
      - name: Login to Azure (OIDC)
        uses: azure/login@v2
        with:
          client-id:       ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id:       ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resolve SWA deployment token
        id: swa
        run: |
          TOKEN=$(az staticwebapp secrets list \
            --name mathema-swa \
            --resource-group mathema-prod-cin \
            --query "properties.apiKey" -o tsv)
          if [ -z "$TOKEN" ]; then
            echo "::error::Could not fetch SWA deployment token"
            exit 1
          fi
          echo "token_len=${#TOKEN}"
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Show SWA target (sanity)
        run: |
          az staticwebapp show \
            --name mathema-swa \
            --resource-group mathema-prod-cin \
            --query "{name:name, location:location, sku:sku.name, defaultHostname:defaultHostname, repositoryUrl:repositoryUrl}" \
            -o json

      - name: Deploy verified artifact to Static Web Apps
        run: |
          # Pin the deployment client so a new CLI release cannot silently
          # change artifact discovery or upload behavior between releases.
          npx -y @azure/static-web-apps-cli@2.0.9 deploy ./app/dist \
            --deployment-token "${{ steps.swa.outputs.token }}" \
            --env production \
            --verbose silly

      - name: Resolve deployed SWA hostname
        id: target
        run: |
          HOSTNAME=$(az staticwebapp show \
            --name mathema-swa \
            --resource-group mathema-prod-cin \
            --query defaultHostname -o tsv)
          if [ -z "$HOSTNAME" ]; then
            echo "::error::Could not resolve the Static Web Apps default hostname"
            exit 1
          fi
          echo "hostname=$HOSTNAME" >> "$GITHUB_OUTPUT"

      # A successful upload is not enough: the incident signature was a 200
      # text/html response for a missing hashed .js file. Compare deployed
      # bytes to this run's artifact and require correct MIME for JS/CSS and
      # all Play Console legal Markdown URLs on both Azure and the custom host.
      - name: Post-deploy static content smoke
        env:
          SWA_ORIGIN: https://${{ steps.target.outputs.hostname }}
        run: |
          set -euo pipefail

          smoke_with_retry() {
            local origin="$1"
            for attempt in $(seq 1 12); do
              if node scripts/verify-static-site.mjs --artifact app/dist --url "$origin"; then
                return 0
              fi
              if [ "$attempt" -lt 12 ]; then
                echo "Static content not fully propagated at $origin (attempt $attempt/12); retrying in 10s..."
                sleep 10
              fi
            done
            echo "::error::Static content smoke failed after 12 attempts for $origin"
            return 1
          }

          smoke_with_retry "$SWA_ORIGIN"
          smoke_with_retry "$PRODUCTION_ORIGIN"
