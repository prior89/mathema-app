name: Frontend — build & deploy to Azure Static Web Apps

# Build the Vite SPA, deploy to SWA. Triggered on main pushes to app/ or this file.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

env:
  # Backend URL injected as VITE_API_BASE_URL at build time so the SPA calls
  # the right API host. Adjust if your Container App FQDN changes.
  VITE_API_BASE_URL: https://mathema-backend.redcoast-6e6508a7.centralindia.azurecontainerapps.io/api/v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'app/package-lock.json'

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: npm run build

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: 'app/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true
