name: Frontend — build & deploy to Azure Static Web Apps

# Build the Vite SPA, deploy to SWA. Triggered on main pushes to app/ or this file.

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/frontend-deploy.yml'
  workflow_dispatch:

env:
  # Backend URL injected as VITE_API_BASE_URL at build time so the SPA calls
  # the right API host. Adjust if your Container App FQDN changes.
  VITE_API_BASE_URL: https://mathema-backend.redcoast-6e6508a7.centralindia.azurecontainerapps.io/api/v1

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          lfs: false

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Install at the workspace root because deps live in the root lock.
      - name: Install workspace deps
        run: npm ci

      - name: Build Vite SPA
        env:
          VITE_API_BASE_URL: ${{ env.VITE_API_BASE_URL }}
        run: npm -w app run build

      # Use the SWA CLI directly — the static-web-apps-deploy action keeps
      # returning "An unknown exception" with both Oryx and skip-build modes,
      # which is a well-known opaque-failure path. The CLI is more verbose
      # and gives a real error if something is off (token, target, etc.).
      - name: Deploy to Static Web Apps (swa CLI)
        run: |
          npx -y @azure/static-web-apps-cli@latest deploy ./app/dist \
            --deployment-token "${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}" \
            --env production
